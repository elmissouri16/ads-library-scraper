[project]
name = "ads-library-scraper"
version = "0.1.0"
description = "Scrape the public Meta Ad Library with curl_cffi"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "curl-cffi>=0.17.0",
]

[project.scripts]
ads-library = "ads_library.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ads_library"]
